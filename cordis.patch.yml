# @morewax/dsh-stack default rows.
#
# Active by default: only the zero-config-safe plugins. Everything that needs
# your environment (remote host, memory dir, knowledge bundle) is a commented
# template — `npx @morewax/dsh-stack init` fills these in for you.

# MCP manager: the + button by the composer for adding MCP servers, with
# keys in the managed credential store (never in YAML).
- id: mcp-manager
  name: '@morewax/dsh-mcp-manager'

# ---- templates (uncomment + edit, or run the init) -------------------------

